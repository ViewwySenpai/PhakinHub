[package]
name = "phakinhub"
version = "6.1.2"
edition = "2021"
description = "PhakinHub native Rust desktop tools"

[[bin]]
name = "phakinhub-rust"
path = "src/main.rs"

[dependencies]
eframe = { version = "=0.33.0", default-features = false, features = ["default_fonts", "glow"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Controls_Dialogs", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_HiDpi"] }

[profile.release]
opt-level = 2
strip = true
lto = "thin"
codegen-units = 8

